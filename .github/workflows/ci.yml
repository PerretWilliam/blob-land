name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The API's tests run against a real Postgres.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: blob
          POSTGRES_PASSWORD: blob
          POSTGRES_DB: blob_land_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blob -d blob_land_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: install pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test
