name: build

# Building the app on three systems is slow and, on macOS, costly in Actions
# minutes: it runs for a release of the app (the tag Changesets pushes) or by
# hand, not on every push. Pull requests get the quick checks in ci.yml.
on:
  push:
    tags:
      - "@blob-land/desktop@*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]

    # macOS minutes cost 10x on Actions, so that leg runs on the self-hosted
    # runner instead; ubuntu and windows stay on GitHub-hosted runners.
    runs-on: ${{ matrix.platform == 'macos-latest' && fromJSON('["self-hosted", "macOS"]') || matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
