name: release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A PAT, not the default GITHUB_TOKEN: tags and commits pushed with
          # the default token don't trigger other workflows (build.yml).
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: install pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: version or release
        uses: changesets/action@v2
        with:
          pr-title: "Version Packages"
          commit-message: "chore: version packages"
          publish-script: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
