version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for the minor and patch updates, one each for majors.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Bumped by hand, with tauri-plugin-http in Cargo.toml: the two must match.
      - dependency-name: "@tauri-apps/plugin-http"
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    ignore:
      # Bumped by hand, with @tauri-apps/plugin-http: the two must match.
      - dependency-name: tauri-plugin-http
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Every action in one pull request, majors included.
      actions:
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: ci
