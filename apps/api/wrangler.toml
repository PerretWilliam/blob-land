name = "blob-land-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "blob-land"
database_id = "REPLACE_ME" # `wrangler d1 create blob-land`, then paste the id here
# Accounts and the blob directory: `pnpm db:apply` (locally) or
# `wrangler d1 migrations apply blob-land --remote` before deploying.
migrations_dir = "migrations"

# Cloudflare's Rate Limiting binding, applied to /auth/* only (see src/index.ts).
[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# JWT_SECRET is a secret, not a var: `wrangler secret put JWT_SECRET`.
# For local dev/tests, put it in a .dev.vars file (gitignored).

# One object per region (src/region.ts): it holds the region in its own
# SQLite and lives it forward on its own alarm.
[[durable_objects.bindings]]
name = "REGION"
class_name = "Region"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Region"]

# A watchdog only: it sets again any region's alarm that stopped (index.ts).
[triggers]
crons = ["*/5 * * * *"]

# Logs (console.error on a failed request or step) kept and searchable in the dashboard.
[observability]
enabled = true
